<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatDora Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f6fcf8;
        color: #10392b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(16, 185, 129, 0.16), transparent 28%),
          radial-gradient(circle at top right, rgba(249, 115, 22, 0.1), transparent 22%),
          #f6fcf8;
      }

      main {
        width: min(92vw, 32rem);
        padding: 2rem;
        border-radius: 1.75rem;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(16, 57, 43, 0.08);
        box-shadow: 0 20px 50px rgba(16, 57, 43, 0.08);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }

      p {
        margin: 0 0 1rem;
        line-height: 1.6;
        color: #42685a;
      }

      a {
        display: inline-block;
        margin-top: 0.5rem;
        color: white;
        background: #0f6b4a;
        padding: 0.9rem 1.2rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>ChatDora is still available as an installed app, but this screen needs a connection for live account and WhatsApp data.</p>
      <p>Reconnect to restore syncing, notifications, and dashboard updates.</p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
